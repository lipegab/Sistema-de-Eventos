<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <title>Cultura em Cena</title>
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <meta content="" name="keywords">
        <meta content="" name="description">

        <!-- Google Web Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Roboto&display=swap" rel="stylesheet"> 

        <!-- Icon Font Stylesheet -->
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

        <!-- Libraries Stylesheet -->
        <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
        <link href="lib/lightbox/css/lightbox.min.css" rel="stylesheet">


        <!-- Customized Bootstrap Stylesheet -->
        <link href="css/bootstrap.min.css" rel="stylesheet">
        
        <!-- Template Stylesheet -->
        <link href="css/stlye2.css" rel="stylesheet">
        
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        
        <script>
            function validar_form()
            {
                let primeiroNome = document.getElementById('primeiroNome');
                let Sobrenome = document.getElementById('Sobrenome');
                let Email = document.getElementById('email');
                let Celular = document.getElementById('celular');
                let email = document.getElementById('email');
                let senha = document.getElementById('senha');
                let confirmeSenha = document.getElementById('confirmeSenha');

                if (primeiroNome.value == '')
                {
                    Swal.fire
                    ({
                        icon: 'error',
                        title: 'Erro',
                        text : 'Por favor, preencha seu nome.',
                        confirmButtonText: 'OK',
                        confirmButtonColor: 'var(--bs-primary)',
                    
                    });
                    return false;
                }

                else if(Sobrenome.value == '')
                {
                    Swal.fire
                    ({
                        icon: 'error',
                        title: 'Erro',
                        text : 'Por favor, preencha seu sobrenome.',
                        confirmButtonText: 'OK',
                        confirmButtonColor: 'var(--bs-primary)',
                    });
                    return false;
                }

                else if(email.value == '')
                {
                    Swal.fire
                    ({
                        icon: 'error',
                        title: 'Erro',
                        text : 'Por favor, preencha seu email.',
                        confirmButtonText: 'OK',
                        confirmButtonColor: 'var(--bs-primary)',
                    });
                    return false;
                }

                else if(celular.value == '')
                {
                    Swal.fire
                    ({
                        icon: 'error',
                        title: 'Erro',
                        text : 'Por favor, preencha seu celular.',
                        confirmButtonText: 'OK',
                        confirmButtonColor: 'var(--bs-primary)',
                    });
                    return false;
                }

                else if(senha.value == '')
                {
                    Swal.fire
                    ({
                        icon: 'error',
                        title: 'Erro',
                        text : 'Por favor, preencha sua senha.',
                        confirmButtonText: 'OK',
                        confirmButtonColor: 'var(--bs-primary)',
                    });
                    return false;
                }

                else if(confirmeSenha.value == '')
                {
                    Swal.fire
                    ({
                        icon: 'error',
                        title: 'Erro',
                        text : 'Por favor, preencha seu email.',
                        confirmButtonText: 'OK',
                        confirmButtonColor: 'var(--bs-primary)',
                    });
                    return false;
                }
                
                    
                else if (senha.value != confirmeSenha.value)
                {   
                    Swal.fire
                    ({
                        icon: 'error',
                        title: 'Erro',
                        text : 'Por favor, preencha seu email.',
                        confirmButtonText: 'OK',
                        confirmButtonColor: 'var(--bs-primary)',
                    });
                    return false;
                }
                return true;
                   
            }
        </script>


    </head>

    <body>
           <div class="container-fluid bg-secondary py-5">
            <div class="container py-5">
                <div class="row justify-content-center">
                    <div class="col-lg-8 col-md-10">
                        <div class="contact p-4">
                            <div class="row g-0 align-items-center">
                                <!-- imagem -->
                                <div class="col-md-5 d-none d-md-block text-center"> <img src="img/undraw_writing-online_x665 (1).svg" class="img-fluid p-3" alt="Cadastro"> </div>

                                <!-- formulario -->
                                <div class="col-md-7">
                                    <div class="p-4">
                                        <h2 class="mb-3 text-center">Cadastre-se</h2>
                                        <p class="mb-4 text-center"> Crie sua conta para acessar nossos serviços.</p>

                                        <form id="formCadastro" onsubmit="return validar_form()">
                                            <div class="row gx-3 gy-3">
                                                <div class="col-md-6">
                                                    <input id="primeiroNome" type="text" name="primeiroNome" class="form-control bg-white border-0 py-3 px-4" placeholder="Primeiro nome">
                                                </div>

                                                <div class="col-md-6">
                                                    <input id="sobrenome" type="text" name="sobrenome" class="form-control bg-white border-0 py-3 px-4" placeholder="Sobrenome">
                                                </div>

                                                <div class="col-12"> 
                                                    <input id="email" type="email" name="email" class="form-control bg-white border-0 py-3 px-4"placeholder="Email">
                                                </div>

                                                <div class="col-12">
                                                    <input id="celular" type="tel" name="celular" class="form-control bg-white border-0 py-3 px-4" placeholder="Celular">
                                                </div>

                                                <div class="col-md-6">
                                                    <input id="senha" type="password" name="senha" class="form-control bg-white border-0 py-3 px-4" placeholder="Senha">
                                                </div>

                                                <div class="col-md-6">
                                                    <input id="confirmeSenha" type="password" name="confirmeSenha" class="form-control bg-white border-0 py-3 px-4" placeholder="Confirmar senha" >
                                                </div>

                                                <div class="col-12">
                                                    <button class="btn-hover-bg btn btn-primary w-100 py-3 px-5" type="submit">Criar Conta</button>
                                                </div>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    
    </body>
</html>
